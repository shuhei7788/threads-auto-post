name: 自動投稿

on:
  schedule:
    # 毎時50分に起動し、投稿時刻（src/scheduled.mjs の SCHEDULE）を過ぎていて今日まだ投稿していないアカウントだけ投稿する。
    # GitHub の定時実行は遅れたり飛ばされたりするので、1回飛ばされても次の回で投稿される。
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: アカウント
        type: choice
        options: [donut, ice]
        required: true
      dry_run:
        description: 投稿せずに内容だけ確認する（外すと今すぐ投稿）
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 定時の投稿
        if: github.event_name == 'schedule'
        env:
          THREADS_TOKEN_DONUT: ${{ secrets.THREADS_TOKEN_DONUT }}
          THREADS_TOKEN_ICE: ${{ secrets.THREADS_TOKEN_ICE }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: node src/scheduled.mjs

      - name: 手動の投稿
        if: github.event_name == 'workflow_dispatch'
        env:
          ACCOUNT: ${{ inputs.account }}
          THREADS_TOKEN: ${{ inputs.account == 'donut' && secrets.THREADS_TOKEN_DONUT || secrets.THREADS_TOKEN_ICE }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/post.mjs "$ACCOUNT"

      # 投稿に失敗しても、もう片方のアカウントの投稿済みの位置は保存する
      - name: 投稿済みの位置を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts/*/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "posted"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
