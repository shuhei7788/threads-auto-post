name: 自動投稿

on:
  schedule:
    # 毎時45分に起動し、投稿時刻（src/scheduled.mjs の SCHEDULE）を過ぎていて今日まだ投稿していないアカウントだけ投稿する。
    # GitHub の定時実行は3〜5時間おきになることがあるので、cron-job.org からも毎時 account=auto で起動している（README 参照）。
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      account:
        description: アカウント（auto は時刻になったアカウントだけ投稿）
        type: choice
        options: [auto, donut, ice]
        default: auto
        required: true
      dry_run:
        description: 投稿せずに内容だけ確認する（外すと今すぐ投稿）
        type: boolean
        default: true

permissions:
  contents: write

# 定時と外部からの起動が重なっても、1つずつ順番に動かす
concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # 順番待ちの間にほかの回が投稿しているかもしれないので、起動時点ではなく最新の main を使う
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 写真の公開URLを決める
        run: echo "IMAGE_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 定時の投稿
        if: github.event_name == 'schedule' || inputs.account == 'auto'
        env:
          THREADS_TOKEN_DONUT: ${{ secrets.THREADS_TOKEN_DONUT }}
          THREADS_TOKEN_ICE: ${{ secrets.THREADS_TOKEN_ICE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/scheduled.mjs

      - name: 手動の投稿
        if: github.event_name == 'workflow_dispatch' && inputs.account != 'auto'
        env:
          ACCOUNT: ${{ inputs.account }}
          THREADS_TOKEN: ${{ inputs.account == 'donut' && secrets.THREADS_TOKEN_DONUT || secrets.THREADS_TOKEN_ICE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node src/post.mjs "$ACCOUNT"

      # 投稿に失敗しても、もう片方のアカウントの投稿済みの位置は保存する
      - name: 投稿済みの位置を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts/*/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "posted"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
